[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = 'test_support'
description = ''
version = '3.0.0'
requires-python = ">=3.10"
dependencies = [
    'colorama==0.4.6',
    'grpcio==1.82.1',
    'protobuf==7.35.1',
    'PyYAML==6.0.2'
]

[project.optional-dependencies]
test = [
    'pytest',
    'pytest-cov',
    'pytest-xdist'
]

[tool.setuptools]
packages = [
    'Pyxsim',
    'testplan',
    'testplan.resources',
    'xcoverage'
]

[tool.setuptools.package-data]
testplan = [
    'resources/*.css',
    'resources/*.yml'
]
